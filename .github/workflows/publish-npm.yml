name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      release:
        description: patch, minor, major, prerelease, or exact semver
        required: true
        default: patch
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options: [latest, next]
      macosRunner:
        description: Hosted macOS runner for release QA
        required: false
        default: macos-latest
        type: choice
        options: [macos-latest, macos-15-intel]
      publishOnly:
        description: Recover a missing npm version from its existing Git tag
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  qa:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ${{ inputs.macosRunner }}
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - run: node --test test/lifecycle.test.mjs test/pack.test.mjs
      - run: node --test test/archived-updater.test.mjs
      - run: python -m pip install . pytest
      - run: python -m pytest -q
  publish:
    needs: qa
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm for OIDC
        run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run check --if-present
      - run: node --test test/pack.test.mjs
      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish @petercjl/jqcli
        if: ${{ !inputs.publishOnly }}
        run: npx --yes --package @petercjl/npm-release-kit@0.1.4 npm-release-kit ci publish --release "${{ inputs.release }}" --tag "${{ inputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover exact tagged npm artifact
        if: inputs.publishOnly
        env:
          RELEASE_VERSION: ${{ inputs.release }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/verify-npm-release.mjs "$RELEASE_VERSION" "$RELEASE_TAG" check-absent
          release_source="$RUNNER_TEMP/jqcli-release"
          git worktree add --detach "$release_source" "refs/tags/v$RELEASE_VERSION"
          cd "$release_source"
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          archive=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          npm publish "$RUNNER_TEMP/$archive" --access public --tag "$RELEASE_TAG" --registry https://registry.npmjs.org/ --loglevel notice
      - name: Verify public npm release and tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RECOVERY_VERSION: ${{ inputs.publishOnly && inputs.release || '' }}
        run: node scripts/verify-npm-release.mjs "${RECOVERY_VERSION:-$(node -p 'require("./package.json").version')}" "$RELEASE_TAG"
